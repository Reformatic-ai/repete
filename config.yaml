# ============================================================
# WHICH OF THE ABOVE ARE BASKETS, NOT COMPANIES
# ============================================================
# Read by `strategies.excluded_etfs`, and ONLY for a strategy that opts in with
# `exclude_etfs: true` — today that is `xsmom` alone. ma_crossover, tsmom and
# meanrev were gated on all 38 names WITH these eight in, so removing them from
# under those strategies would be a live behaviour change to the exact evidence
# record this project is trying to accumulate.
#
# Why a CROSS-SECTIONAL strategy must not rank these: XLK is not a peer of AAPL,
# it is partly MADE of it. A percentile containing both measures two different
# kinds of thing on one scale. §49 put a number on the cost — 11 of the 13
# symbol pairs at or above the 0.85 correlation threshold involve an ETF, versus
# 2 of 435 stock-vs-stock pairs — so shorting XLK against a book long AAPL/MSFT/
# NVDA unwinds the book's own longs instead of adding alpha.
#
# EVERY NAME HERE MUST ALSO APPEAR IN `symbols:` ABOVE, and preflight refuses to
# start otherwise. A typo here does not fail loudly; it just quietly stops
# excluding the thing it was meant to exclude, which is how
# `short_bottom_fraction` shipped naming nothing at all.
etfs:
  - SPY                # broad market
  - QQQ                # nasdaq 100
  - DIA                # dow
  - IWM                # small caps
  - XLK                # tech sector
  - XLF                # financials
  - XLE                # energy
  - XLV                # healthcare

# ============================================================
# SECTOR MAP — the `sectors` universe, used by `reclaim` ONLY.
# ============================================================
# `symbols:` above is the CORE universe and is deliberately untouched. The
# 25->38 expansion was adopted only after every enabled strategy re-passed its
# gate ON the expanded universe; widening `symbols:` again would force the same
# re-gating on ma_crossover, tsmom and meanrev, could disable strategies that
# currently work, and would change their LIVE behaviour immediately (80-odd new
# names to buy crossovers in). That restarts the evidence clock for the whole
# ensemble in order to add one leg. Per-strategy universes (`universe:` below)
# keep the cost local to the new strategy.
#
# NO ETFs. The original design used sector ETFs as the measuring instrument.
# They cannot be used: ALL FIVE wide snapshots contain 500 stocks and SPY and
# ZERO sector ETFs (no XLK, XLF, XLI, ...), so an ETF-based sector ranking is
# unscoreable on every dataset this repo has and the DIAGNOSTIC could not run.
# A new snapshot is out (§52 freeze, no data purchase). A sector is therefore
# scored from its OWN CONSTITUENTS — see `reclaim.sector_score` below. That is
# also the better measurement: it removes the ETF-vs-constituent category error
# the 130/30 design already identified, and it scores exactly the names the
# strategy can actually trade.
#
# HOW THESE NAMES WERE CHOSEN — an objective rule, run once and frozen, so that
# nobody (including the author) can later claim they were picked after seeing
# which sectors were down:
#   1. Candidates = symbols present in ALL FIVE wide snapshots: 263 of 500.
#      That restriction is what lets ONE universe be scored in every period.
#      It is also the survivorship story made concrete — 237 names do not
#      survive the intersection.
#   2. Sector = yfinance's GICS-style `sector` field, read 2026-08-05, frozen.
#   3. Within each sector, rank by MEDIAN DAILY DOLLAR VOLUME over the most
#      recent snapshot; keep the top 12. Dollar volume rather than market cap:
#      market cap came back None for ~20% of the pool, it is point-in-time, and
#      liquidity is the property that decides tradeability. MEDIAN so one
#      halt-and-spike day cannot promote a symbol.
#
# BRK-B WAS DROPPED, DELIBERATELY. It ranked into Financial Services, but the
# snapshots spell it `BRK-B` (yfinance) and Alpaca spells it `BRK.B`. Carrying
# it would mean either a symbol-translation layer — a new live/sim divergence
# for one name — or a symbol Alpaca rejects on every cycle. Financial Services
# therefore has 11 names, and this note is why; it is NOT a silent shortfall.
sectors:
  Technology:             [NVDA, AAPL, MSFT, AMD, INTC, MU, ADBE, QCOM, AMAT, CSCO, ORCL, TXN]
  Healthcare:             [UNH, LLY, JNJ, PFE, MRK, TMO, DHR, AMGN, BMY, ABT, GILD, MDT]
  Industrials:            [BA, GE, CAT, UNP, HON, RTX, DE, LMT, UPS, FDX, CSX, MMM]
  Financial Services:     [JPM, BAC, WFC, C, GS, MS, AXP, SPGI, SCHW, COF, CB]
  Consumer Cyclical:      [AMZN, HD, BKNG, NKE, MCD, SBUX, F, LOW, CCL, TJX, RCL, ORLY]
  Consumer Defensive:     [COST, WMT, PG, KO, PEP, TGT, CL, EL, MO, DLTR, KR, STZ]
  Energy:                 [XOM, CVX, COP, OXY, SLB, VLO, EOG, DVN, HAL, EQT, WMB, BKR]
  Utilities:              [NEE, SO, DUK, AEP, EXC, PCG, D, SRE, XEL, ED, PEG, ETR]
  Real Estate:            [AMT, PLD, CCI, SPG, PSA, SBAC, AVB, EQR, WY, HST, BXP]
  Basic Materials:        [LIN, FCX, NEM, SHW, APD, NUE, ECL, AA, DD, PPG, MLM, VMC]
  Communication Services: [DIS, CMCSA, T, VZ, EA, TTWO, MTCH, OMC, SIRI]

# ============================================================
# SECTOR FUNDS — the `sector_etfs` universe, used by `swing_sectors` ONLY.
# ============================================================
# The 11 SPDR sector funds, one per GICS sector. Same design as the sector
# map above: a per-strategy universe that adds names WITHOUT widening
# `symbols:` (the core universe three gated strategies were measured on).
# Four of these (XLK, XLF, XLE, XLV) also sit in `symbols:` — that overlap is
# fine and pre-existing; the ensemble holds at most one position per symbol,
# whoever owns it.
#
# NOT merged into `etfs:`: that list answers "which core-universe names are
# baskets" for cross-sectional exclusion, carries the broad-market funds
# (SPY, QQQ, DIA, IWM), and every member must be in `symbols:`. This list
# answers "what does swing_sectors rank", and a sector-value ranking that
# contains the whole market as a member is measuring itself against itself.
#
# XLRE (2015) and XLC (2018) have the shortest histories — §57's survivorship
# probe certified this family (the "15 certified funds", 13 in the earliest
# period). With high_lookback_bars 252 they rank once they carry a year of
# bars; before that `drawdown_pct` returns None and they are simply absent
# from the cross-section, which `min_ranked` treats as an outage floor.
sector_etfs: [XLK, XLF, XLE, XLV, XLI, XLP, XLY, XLU, XLB, XLRE, XLC]

# §64 single-purpose universes. `spy_only` scopes the three SPY-switch
# candidates to the one instrument their evidence record is about;
# `gem_legs` is the Antonacci rotation set (US / developed ex-US / bonds).
# EFA and AGG are NOT in symbols: — same rationale as sector_etfs above.
spy_only: [SPY]
gem_legs: [SPY, EFA, AGG]

strategy:              # execution globals (per-strategy params live in strategies:)
  name: ma_crossover   # legacy field, kept for compatibility
  fast_period: 10      # legacy ma_crossover params (strategies: section wins)
  slow_period: 30
  timeframe: 1Day      # SWING BOT: keep this on 1Day. Intraday timeframes = day trading.
  lookback_bars: 100   # FLOOR on bars fetched; ensemble raises it to its max need

strategies:            # the ensemble — deterministic signals only, LLM never generates them.
                       # `enabled` gates ENTRIES; exits always route to the strategy that
                       # opened the position (ownership), even if since disabled.
                       # A strategy may only be enabled after passing the walk-forward
                       # OOS gate (python src/backtest.py --strategy NAME ...).
  ma_crossover:
    enabled: true      # baseline / teaching device; the ensemble must beat it
    priority: 1        # §20a demoted this to 3; §22 REVERTED that — see below.
    fast_period: 10
    slow_period: 30
    max_open_positions: 0   # 0 = ceiling disabled, UNCAPPED, not "no positions"
                            # (§29 2026-07-26). Was 5 — §13 held it
                            # at status quo so it could not absorb meanrev's
                            # headroom. With the global ceiling gone there is no
                            # headroom to compete over: heat and concentration
                            # bound the book, not a queue for slots.
  tsmom:               # time-series momentum (Moskowitz/Ooi/Pedersen)
    enabled: true      # PASSED gate 2026-07-15: OOS +1.45%, PF 2.56, 51 trades
    priority: 2        # (exposure-matched benchmark; see research/trials.jsonl)
    momentum_bars: 63  # in-sample grid winner — never re-picked after OOS
    skip_bars: 0
    max_open_positions: 0   # 0 = ceiling disabled, UNCAPPED, not "no positions"
                            # (§29, owner decision 2026-07-26).
                            # THIS IS THE ONE WITH COUNTER-EVIDENCE AGAINST IT.
                            # Was 5, held there by §13 clause (b) because §12
                            # measured tsmom's PF COLLAPSING as slots rise
                            # (2.398 -> 1.977 -> 1.730) while return rises — the
                            # extra trades are risk bought at a worse rate.
                            # That evidence has not been refuted; the owner has
                            # accepted the tradeoff (more trades, worse average
                            # trade) in exchange for the sample rate needed to
                            # learn anything at all — 1 closed trade in 10 live
                            # days puts the 30-trade revenue gate 300 days out.
                            # §29 re-measures it at the new sizing, where the
                            # §12 result may not even hold: it was produced
                            # behind the $2k clamp, at 2.5% deployment.
    trend_sma_period: 200
    index_sma_period: 0   # SPY<SMA50 entry gate: adopted 2026-07-16, REVERTED
                          # 2026-07-17 — the IS win didn't replicate on a
                          # frozen data snapshot (ungated won IS; OOS tied).
                          # The original evidence was API re-fetch drift.
                          # Code path kept for future retests (0 = off).
                          # See knowledge/backtest_candidates.md §3.
    earnings_blackout_days: 3  # no NEW entries in names reporting within 3
                          # days. PASSED gate 2026-07-17 on the frozen
                          # snapshot: IS +3.89 PF 2.62 (vs +3.50/2.29
                          # unfiltered), OOS +1.38 PF 2.22 >= baseline
                          # +1.25/2.01, lower dd. PER-STRATEGY on purpose:
                          # the same filter HURT meanrev (dip edge includes
                          # pre-earnings jitters) — keep it off there.
  xsmom:               # cross-sectional momentum (Jegadeesh/Titman 12-1)
    enabled: false     # FAILED gate 2026-07-15 (OOS below exposure-matched benchmark)
    priority: 3
    exclude_etfs: true        # the eight names in `etfs:` leave this ranking.
                              # A basket is not a peer of its own constituents,
                              # and §49 measured what happens when they share a
                              # cross-section: 11 of 13 correlated pairs involve
                              # an ETF. This CHANGES what xsmom's percentile
                              # means (30 rankable names, not 38), so the gate
                              # it FAILED on 2026-07-15 no longer describes this
                              # strategy — it has to be re-gated before it could
                              # ever be enabled, which it must be regardless.
    rank_lookback_bars: 231   # ~11 months, with skip -> classic 12-1 formation
    skip_bars: 21             # skip most recent month (short-term reversal)
    buy_top_fraction: 0.25
    exit_below_fraction: 0.50
    short_bottom_fraction: 0.25
                              # THE MIRROR of buy_top_fraction, and a
                              # PRE-REGISTERED STARTING POINT, NOT A FITTED
                              # RESULT — chosen because it is the symmetric
                              # value, before any run scored it.
                              #
                              # NOTHING SHORTS: xsmom is enabled: false above,
                              # and preflight's account guard only convicts an
                              # ENABLED strategy, so arming this cannot abort a
                              # live cycle or place an order. It arms the leg
                              # for the Phase 3 DIAGNOSTIC, which has to be
                              # registered and run before enabled: true is even
                              # a question.
                              #
                              # The bottom 25% of ~30 rankable names is roughly
                              # seven or eight candidates; how many actually
                              # become positions is a question for the
                              # DIAGNOSTIC, not for this comment — the
                              # correlation cap, sector concentration,
                              # portfolio heat and the net-exposure band all
                              # subtract from it.
  donchian:            # §17 candidate: N-bar breakout, M-bar exit (Turtle asymmetry)
    enabled: false     # DISABLED until it passes the walk-forward enablement gate.
                       # Params below are the pre-registered starting point, NOT
                       # a fitted result — 20/10 is the classical Turtle pair and
                       # SMA200 mirrors the filter meanrev already relies on.
    priority: 5
    entry_channel_bars: 20
    exit_channel_bars: 10
    trend_sma_period: 200
  meanrev:             # Connors RSI-2 dip-buying, SMA200-filtered
    enabled: true      # PASSED gate 2026-07-15: OOS +1.40%, PF 2.19, 71% win, 171 trades
    priority: 4        # §22 (2026-07-23): §20a moved meanrev to priority 1 on
                       # numbers measured in the WRONG SYMBOL ORDER. The sim
                       # iterated the snapshot's alphabetical order; live scans
                       # `list(cfg["symbols"])` (main.py scan_symbols). Re-measured
                       # in live order the reorder FAILS its own gate: return
                       # +2.669% -> +2.086% and PF 1.955 -> 1.457, far outside the
                       # "PF >= baseline - 0.15" clause. It does still deliver the
                       # velocity (179 -> 253 trades, meanrev 25 -> 104) — but not
                       # for free, which is exactly what §20a claimed. REVERTED.
    rsi_period: 2
    rsi_buy_below: 10  # in-sample grid winner — never re-picked after OOS
    trend_sma_period: 200
    exit_sma_period: 5
    max_hold_days: 7
    max_open_positions: 0   # 0 = ceiling disabled, UNCAPPED, not "no positions"
                            # (§29 2026-07-26). Was 8, and §20b had
                            # already found it INERT. Prior note kept below —
                            # it documents exactly why a count cap was never
                            # doing the work it appeared to do:
                            # [prior] §13 slot allocation (2026-07-23). NOTE §20b: measured
                            # under the ensemble simulator this value is INERT —
                            # an arm with 5/5/5 produces byte-identical OOS results,
                            # because the GLOBAL ceiling of 8 is consumed by the two
                            # higher-PRIORITY strategies before meanrev is consulted.
                            # Left at 8 (it costs nothing and is the right value if
                            # priority is ever reordered), but it is NOT doing the
                            # work §13 claimed. The real starvation mechanism is
                            # entry priority — see §20a. meanrev exits on
                            # SMA5 and cycles fast, but a SHARED pool let tsmom
                            # hold every slot for weeks and starve it — the live
                            # cause of ~0 evidence velocity (146 buy signals, 6
                            # executions, 68 blocked on max_open_positions).
                            # Gate: OOS trades 160->177, PF 2.076->2.116,
                            # maxDD unchanged 0.5%. The global cap still binds.
  reclaim:             # unloved-sector 200-DMA reclaim (owner direction 2026-08-05)
    enabled: false     # DISABLED until it passes the walk-forward enablement gate.
                       # READ THE NEXT PARAGRAPH BEFORE READING A PASS AS EVIDENCE.
                       #
                       # Backtests are a NEGATIVE FILTER ONLY for this project,
                       # and this strategy family is the one where that matters
                       # most: buying names that fell below their 200-DMA is
                       # MAXIMALLY flattered by survivorship, because the names
                       # that fell and never came back are precisely the ones a
                       # survivor universe deletes. §51 measured +200.28pp of
                       # survivorship on the live universe. So a PASS here is
                       # not merely uninformative, it is MISLEADING; only a
                       # FAIL is decisive. Params below are a PRE-REGISTERED
                       # starting point, NOT a fitted result.
                       #
                       # Every entry is an inversion of the filter meanrev's
                       # docstring calls LOAD-BEARING ("unfiltered RSI(2) lost
                       # heavily in the 2022 bear"). That is why this is a new
                       # strategy with its own gate and not a flipped
                       # comparison inside meanrev.
    priority: 6        # lowest: it must never pre-empt a gated strategy's entry
    universe: sectors  # the `sectors:` map above, NOT `symbols:`. Absent =>
                       # the core universe, so every other strategy is unchanged.
    # ---- sector selection: DEPTH, not breadth (owner decision 2026-08-05) ----
    # MEASURED TRADE RATE, 2026-08-05, before any rail rejects anything:
    # replaying these exact params over the 2020-2026 wide snapshot at DAILY
    # resolution (a reclaim is a single-bar event, so a coarser step
    # undercounts proportionally) produced **72 entry signals across 1337
    # trading days on 127 names — about 14 per year.**
    #
    # (It was 80 before the base test was corrected to exclude the reclaim bar
    # itself. Those 8 were the falling-knife case the base test exists to
    # refuse: a name in freefall gapping up hard enough that the one bar
    # dragged its own short SMA above where it had been, making "the base is
    # rising" true because of the very bar whose validity was in question.)
    #
    # STATE THE CONSEQUENCE PLAINLY: the evidence plan wants ~200 closed
    # round-trips before a result is read. At 15/yr that is THIRTEEN YEARS, and
    # that is the ceiling — correlation_cap, sector_concentration, portfolio
    # heat and the down-regime gross cap all subtract from it. This strategy as
    # configured cannot produce a decidable forward record on any useful
    # horizon.
    #
    # The levers are `min_days_below`, `laggard_sector_count`, and the size of
    # the sector universe. They are NOT being tuned here: the number above was
    # measured AFTER these values were chosen, and re-picking them against it
    # would be fitting to the very sample the gate is supposed to judge. Raising
    # the rate is a pre-registered decision of its own, made before the run that
    # scores it.
    sector_sma_period: 200
    laggard_sector_count: 4   # of 11. The bottom 4 by median constituent
                              # distance below its own 200-DMA are "unloved".
                              # Depth answers "how far is the typical name from
                              # trend", breadth would answer "how many names are
                              # below it"; they disagree, and depth was chosen.
    min_sector_constituents: 5  # a sector with fewer usable names this cycle is
                              # not ranked at all — a median over 2 names is not
                              # a sector reading, and letting it rank would let
                              # a data outage manufacture a laggard.
    # ---- the base test: it must have STOPPED FALLING ----
    trend_sma_period: 200
    base_sma_period: 50
    min_days_below: 40        # bars below the 200-DMA before it counts as out
                              # of favour rather than a dip. meanrev already
                              # owns the shallow-dip case, above the 200-DMA.
    base_slope_bars: 10       # SMA50 must be higher than it was this many bars
                              # ago — the "stopped falling" evidence.
    # ---- the reclaim trigger ----
    min_rvol: 0               # OFF (0 = disabled), like every other strategy.
                              # Volume confirmation on the crossing bar is part
                              # of this strategy's thesis and it was initially
                              # set to 1.0 here — `test_rvol.py` correctly
                              # refused that: §23's relative-volume filter has
                              # never passed a gate, and "must not silently
                              # change live behaviour" before it does. That
                              # `reclaim` ships disabled is not a defence, since
                              # config.yaml IS the live artifact.
                              #
                              # No bespoke code path exists for this: the shared
                              # rail `risk.rvol_blocked(bars, cfg, name)` already
                              # runs for every strategy in main.py's entry loop
                              # and reads this exact key, so turning it on is a
                              # one-value change once a gate justifies it. Same
                              # treatment as tsmom's `index_sma_period: 0`.
    # ---- exit ----
    exit_buffer_pct: 3.0      # exit when close falls this far back below the
                              # 200-DMA. A buffer, not a touch: re-crossing the
                              # line by a cent is noise, and the bracket stop
                              # already handles a real break.
    max_hold_days: 60         # the thesis is a trend repair, not a permanent
                              # hold; if it has not worked in a quarter it has
                              # not worked.
    max_open_positions: 0     # 0 = ceiling disabled (§29 convention). The
                              # binding limits are risk.sector_concentration
                              # below, the correlation cap, and heat.
  lowvol:              # §32 candidate: low realized volatility, ranked
    enabled: false     # NOT a change of state — it has been disabled since §32.
                       # What changed on 2026-08-10 is that it became REACHABLE.
                       #
                       # It was in REGISTRY with no block here, so
                       # `strategy_params` returned None and every call answered
                       # `hold "no config for strategy lowvol"`. It could not
                       # have traded had somebody set enabled: true, and
                       # `test_lowvol.py` asserted only that it was not enabled —
                       # which passed whether the strategy worked or did not
                       # exist. A check that cannot fail (`ci.yml:55-69`).
                       #
                       # These params are the module's own defaults written down,
                       # not new choices: they reproduce what §32 scored.
    priority: 7        # below reclaim — nothing gated should ever be pre-empted
                       # by a strategy that has not passed anything.
    vol_period: 60
    buy_bottom_fraction: 0.25   # buy the calmest quarter
    exit_above_fraction: 0.50   # exit once a holding leaves the calmer half
  hi52:                # §59 candidate: 52-week-high proximity (George & Hwang 2004)
    enabled: false     # DISABLED, and registered DIAGNOSTIC only — which by
                       # `gatespec.py` decides nothing and licenses nothing.
                       # §52 freezes EDGE on data/snapshots/ and §57's own
                       # pre-committed reading rule closes data/pit/, so there is
                       # no venue in which this could currently earn one.
                       #
                       # Params are the PRE-REGISTERED starting point, not a
                       # fitted result: 252 bars is the paper's own window, and
                       # 0.25/0.50 mirror xsmom's fractions so the two rankings
                       # differ in the STATISTIC and in nothing else. That is the
                       # whole point — §35/§37 rejected the momentum ranking, and
                       # George & Hwang's claim is that this ranking subsumes it.
    priority: 8
    exclude_etfs: true        # same category error as xsmom's, same fix: a
                              # basket is not a peer of its own constituents.
                              #
                              # NOTE FOR ANY ETF-UNIVERSE RUN: this must be set
                              # FALSE in the arm. `etfs:` names eight of the
                              # fifteen certified funds, so `universe_for`
                              # returns base - excluded_etfs and the ranking
                              # silently shrinks to 7 of 15 (and 5 of 13 in the
                              # earliest period) — losing SPY, which is the
                              # benchmark, and every sector fund with the
                              # deepest history.
                              #
                              # It does NOT empty and it does NOT error, which
                              # is what makes it dangerous: n stays above the
                              # `< 4` guard, so the strategy runs and reports
                              # trades. `buy_top_fraction: 0.25` would mean
                              # "the best 1 of 7" instead of "the best 3 of 15"
                              # — a different strategy under the same name,
                              # with nothing in the output saying so.
                              # §59a-d carry the override explicitly.
    high_lookback_bars: 252   # the 52-week window the paper is named for
    buy_top_fraction: 0.25    # buy the quarter nearest their own highs
    exit_below_fraction: 0.50 # exit when a holding leaves the top half
    min_proximity: 0.90       # ABSOLUTE floor beneath the relative rank: a name
                              # must be within 10% of its own high, not merely
                              # the least-broken thing in a broken universe.
                              # Without it the rule buys leaders of a bear
                              # market, which is a relative-strength bet and not
                              # the anchoring mechanism the paper describes.
  swing_sectors:       # unloved-sector swing on the SPDR funds themselves
                       # (owner direction 2026-08-11: "undervalued sectors and
                       # bottlenecks", ETF-first, days-to-weeks holds).
                       # `reclaim` owns the stock-level version of this thesis;
                       # the two are separate strategies with separate gates.
    enabled: false     # DISABLED until the pre-registered §62 gate is run and
                       # the owner reads it. Every param below is the
                       # PRE-REGISTERED starting point, not a fitted result —
                       # re-picking any of them against the gate's own sample
                       # is the in-sample selection this repo refuses.
    priority: 9        # below hi52: it must never pre-empt a gated strategy
    universe: sector_etfs     # the `sector_etfs:` list below — NOT `symbols:`
                              # (that would be the core universe, and widening
                              # it is a live change to three gated strategies),
                              # and NOT `etfs:` (that list also carries the
                              # broad-market funds, and a sector-value ranking
                              # containing the whole market as a member is
                              # measuring itself against itself).
    high_lookback_bars: 252   # the 52-week window drawdown is measured from
    min_drawdown_pct: 12.0    # a sector under 12% off its high is not unloved,
                              # it is normal chop; the ranking alone would
                              # otherwise always nominate SOMETHING (the hi52
                              # min_proximity lesson, pointing the other way)
    laggard_count: 4          # only the 4 deepest of the 11 rank as candidates
                              # (mirrors reclaim.laggard_sector_count)
    min_ranked: 6             # a cross-section under 6 rankable funds is a data
                              # outage, not a market reading — no entries
    stabilize_sma_period: 20  # the short base: close must be above it
    base_slope_bars: 5        # ...and the base no lower than 5 bars ago —
                              # the "stopped falling" evidence (reclaim's base
                              # test, simplified for funds that cannot delist)
    atr_period: 14
    entry_zone_atr_mult: 0.75 # entry zone = [SMA20, SMA20 + 0.75·ATR]: a
                              # pullback toward the rising base, not a chase.
                              # Intraday (swing_scan) a dip INTO the zone
                              # triggers; at the cycle a close inside it does.
    recovered_drawdown_pct: 5.0  # thesis-complete exit: back within 5% of the
                              # 52-week high means the repair happened
    exit_buffer_pct: 3.0      # thesis-failed exit: 3% below the SMA20 base
                              # (same buffer-not-touch reasoning as reclaim's)
    max_hold_days: 45         # a repair that has not happened in ~9 weeks is
                              # not happening; wide, because "accept
                              # volatility" means giving the thesis room
    stop_atr_mult: 3.5        # PER-STRATEGY bracket stop (risk.bracket_prices
                              # reads this before risk.brackets.stop_atr_mult).
                              # Wider than the global 2.0 on purpose — the
                              # owner's "accept volatility" is expressed HERE,
                              # per-trade, and not by moving any portfolio rail.
    max_open_positions: 3     # of 11 sectors — NOT the §29 uncapped
                              # convention: 4 candidates exist at any time by
                              # laggard_count, and holding all of them plus
                              # nothing else would be one correlated bet on
                              # "beaten-down reverts", not four theses.

  # ---- §64 wave (2026-08-12): four gate-first candidates, ALL DISABLED. ----
  # Each exists so a FROZEN SPEC ARM can measure it against SPY total return
  # with honest financing (risk.margin). Params are pre-registered starting
  # points from the published sources, not fitted results. None reads the
  # judge; none touches the live ensemble while disabled.
  trend_hold:            # Gayed-Bilello 200-DMA regime switch on SPY alone
    enabled: false
    priority: 10
    universe: spy_only
    ma_days: 200         # the paper's headline; spec grid probes 100-250
    symbol: SPY
  tom_tilt:              # McConnell-Xu turn-of-the-month window, [-1,+3]
    enabled: false
    priority: 11
    universe: spy_only
    symbol: SPY
    hold_days_into_month: 3
  vol_lever:             # discrete Moreira-Muir: in when calm, out when not
    enabled: false
    priority: 12
    universe: spy_only
    symbol: SPY
    lookback_days: 21
    history_bars: 253    # bars of history requested; spec arms raise to 2520
                         # (the expanding median needs years — the shipped
                         # value only keeps max_lookback_bars at its pinned
                         # 253 while the strategy is disabled)
    entry_frac: 0.75     # enter under 0.75x the expanding median vol
    exit_frac: 1.0       # exit over 1.0x — hysteresis, not a knife edge
    min_history_readings: 12
  gem:                   # Antonacci dual momentum, THE book spec, no grid
    enabled: false
    priority: 13
    universe: gem_legs
    us: SPY
    intl: EFA
    bonds: AGG
    lookback_days: 252   # 12 months — ReSolve's 1,226-sibling study is why
                         # this number may never be shopped after the fact
    max_open_positions: 1  # the rotation holds exactly one leg

risk:                  # ---- HARD RAILS: enforced in deterministic code ----
  risk_per_trade_pct: 8.0        # § 29 ADOPTED 2026-07-26 (was 1.0). Selected by
                                 # the pre-registered rule: highest arm clearing
                                 # maxDD <= 10.0pp (owner ceiling), PF >= 1.3,
                                 # and beating the uncapped-baseline +1.94%.
                                 # Sweep {1,2,4,6,8} OOS, judge model on:
                                 #   1 -> +1.94%  PF 1.607  maxDD 0.73%  deploy  5.0%
                                 #   2 -> +4.00%  PF 1.567  maxDD 1.55%  deploy 10.6%
                                 #   4 -> +8.30%  PF 1.539  maxDD 3.39%  deploy 22.4%
                                 #   6 -> +13.25% PF 1.547  maxDD 5.12%  deploy 34.2%
                                 #   8 -> +17.45% PF 1.549  maxDD 7.51%  deploy 43.6%
                                 # READ THIS BEFORE CELEBRATING THE RETURN: return
                                 # rose 9x and maxDD rose 10.3x. return/maxDD went
                                 # 2.65 -> 2.32, i.e. slightly WORSE. This is
                                 # LEVERAGE, not a better strategy. It still loses
                                 # outright to B&H +36.21%; it passes only on the
                                 # exposure-matched benchmark.
                                 # 8 was the top of the pre-registered range, so
                                 # the boundary was NOT found — 10 may also clear
                                 # 10pp. Extending the sweep after seeing results
                                 # would be shopping; it needs its own gate.
  max_position_pct: 10.0         # no single position may exceed this % of equity.
                                 # §29 (2026-07-26): this is now THE per-name
                                 # exposure rail — max_order_value_usd below is
                                 # disabled, so nothing else bounds a single
                                 # position. Deliberately NOT 0-disableable: a 0
                                 # here yields a sizing ceiling of 0, i.e. no
                                 # trades at all, which is the fail-safe
                                 # direction. Scales with the account, so unlike
                                 # a fixed dollar cap it cannot go stale as
                                 # equity grows.
  max_order_value_usd: 0         # 0 = DISABLED (§29, owner decision 2026-07-26).
                                 # Was 2000 — a 2% ceiling on ~$100k equity, and
                                 # it fired BEFORE every other rail. That single
                                 # line is why the sophisticated rails all
                                 # measured as inert: §11 found risk_pct 1.0/2.0/
                                 # 5.0 byte-identical, §18 rejected regime_exposure
                                 # because "gross never nears the cap", and the
                                 # portfolio heat comment records four positions
                                 # totalling ~$560 against a $4,000 cap.
                                 # Measured on the frozen snapshot, it held
                                 # AVERAGE DEPLOYMENT AT 2.5% OF CAPITAL — the bot
                                 # was ~97% in cash, which is the real reason OOS
                                 # return sat near zero.
                                 # Per-name exposure is now governed by
                                 # max_position_pct below, which scales with the
                                 # account instead of going stale as equity grows.
  min_one_share: false           # §28 CANDIDATE (2026-07-25) — NOT YET GATED.
                                 # When the sizing budget is below one share the
                                 # name becomes unbuyable: GS at $1,098 vs a $999
                                 # notional budget was refused live while the judge
                                 # had APPROVED it at full size. No verdict and no
                                 # rail rejected it — whole-share arithmetic did.
                                 # Enabling this buys 1 share ONLY when a single
                                 # share still fits inside max_order_value_usd,
                                 # max_position_pct and buying power. Stays false
                                 # until it passes a pre-registered gate; a
                                 # strategy/rail change is never adopted by
                                 # enabling it and seeing what happens.
  scan_rotation: true            # §24 (2026-07-24). Contention for slots is
                                 # resolved first-come by scan position, so the
                                 # scan list decided allocation — and it was
                                 # `list(cfg["symbols"])`, i.e. THE ORDER SYMBOLS
                                 # WERE TYPED INTO THIS FILE. SPY/QQQ/DIA/IWM sit
                                 # at positions 0-3 of 38 and won nearly every
                                 # contested slot; the live book confirmed it
                                 # (all 5 held names from positions 0,1,2,3,7).
                                 # Rotating by date.toordinal() advances the
                                 # start one symbol per calendar day, so every
                                 # name leads equally often. Deterministic, not
                                 # random — gate re-runs still reproduce.
                                 # This is a FAIRNESS/CORRECTNESS fix, NOT an
                                 # edge claim: it is not expected to improve
                                 # returns. What it buys is a live record that
                                 # samples all 38 names instead of ~5, which is
                                 # what makes that record interpretable (§18:
                                 # the backtest cannot certify any edge, so the
                                 # forward record is the only clean holdout).
  max_trades_per_day: 15         # RUNAWAY GUARD, NOT A RISK RAIL (§29, owner
                                 # decision 2026-07-26). Was 3, which blocked 59
                                 # of 146 live buy signals — 40% of everything the
                                 # bot wanted to do. Set above observed demand
                                 # (~15 buy signals/day) so it should never refuse
                                 # a real opportunity; what it still bounds is an
                                 # API retry loop, a bad data feed, or a signal
                                 # bug placing orders until buying power runs out.
                                 # 0 disables entirely. Prior rationale below is
                                 # kept because it explains why 3 measured as
                                 # harmless — it was measured behind the GLOBAL
                                 # SLOT CEILING, which no longer exists:
                                 # [prior] circuit breaker on order rate. §19b raised this
                                 # 3 -> 5 earlier the same day; §20c REVERTED it
                                 # once the ensemble simulator could measure the
                                 # rail properly. §19b's evidence summed three
                                 # INDEPENDENT single-strategy replays — an upper
                                 # bound on combined demand, since in reality they
                                 # compete. Measured jointly, caps of 3/5/8/12 give
                                 # +3.237/+3.232/+3.232/+3.232% OOS: the cap barely
                                 # binds at all, because the GLOBAL slot ceiling
                                 # binds first. Reverted to the tighter value — a
                                 # circuit breaker should be as tight as it can be
                                 # when loosening it buys nothing.
  daily_loss_limit_pct: 5.0      # §31 (owner decision 2026-07-26, was 3.0): if
                                 # daily P&L drops below this, FLATTEN + HALT.
                                 # This is the HARD stop — it liquidates.
                                 # Raised because 3.0 became inconsistent with the
                                 # owner's 10pp drawdown tolerance once deployment
                                 # went 5% -> 43.6%: it would have liquidated the
                                 # book at roughly a THIRD of the drawdown the
                                 # owner has accepted, turning a survivable
                                 # correction into a realised loss at the bottom.
                                 # Half the total tolerance is the reasoning — a
                                 # single day consuming half the drawdown budget
                                 # is a genuine emergency, not a bad Tuesday.
  kill_switch:                   # what happens when the flatten above FAILS
                                 # (2026-08-02). Until now: nothing. The halt is
                                 # `freeze`, so no later cycle ran, so nothing
                                 # ever retried — the book sat open after a 5%
                                 # loss with only its broker-side bracket legs
                                 # managing it, until a human noticed.
    auto_retry_flatten: true     # retry until the BROKER says the book is flat.
                                 # false restores the old behaviour: mark it,
                                 # alert, wait for a human. This only ever
                                 # FINISHES a liquidation the daily-loss rail
                                 # already started — not a new reason to sell,
                                 # and it cannot run unless the kill switch
                                 # itself left a pending marker.
    max_attempts: 8              # ~2 hours at the 15-minute retry cadence, then
                                 # STOP and escalate rather than hammer a broker
                                 # that is clearly not taking orders. Eight
                                 # failed scheduled attempts is not transient,
                                 # and an alert repeating every 15 minutes
                                 # forever is one an operator learns to ignore.
                                 # NOTE: clearing HALT cancels a pending
                                 # flatten. The marker lives IN the HALT file
                                 # precisely so `rm HALT` cannot leave a
                                 # liquidation armed against a book you have
                                 # just decided to keep.
  max_drawdown_pct: 10.0         # §31 DRAWDOWN CIRCUIT BREAKER (2026-07-26).
                                 # Peak-to-trough from the equity high-water mark.
                                 # This is the SOFT brake: it blocks new ENTRIES
                                 # and never touches exits, so a slow bleed stops
                                 # you adding risk without liquidating you at the
                                 # low. Distinct from daily_loss_limit_pct above
                                 # on purpose — different situations, different
                                 # acts. 0 disables.
                                 # Set to the owner's stated tolerance. The high
                                 # water mark persists in memory/.equity_highwater
                                 # .json and ratchets UP only; an unreadable file
                                 # fails CLOSED (assumes breached) for one cycle
                                 # and self-heals on the next write.
                                 # The backtester enforces the same rail against
                                 # its own running peak via risk.drawdown_pct —
                                 # a live-only rail would be divergence #9.
  max_open_positions: 0          # 0 = ceiling disabled, UNCAPPED, not "no
                                 # positions" (§29, owner decision 2026-07-26):
                                 # "if there's more to hold onto then hold onto
                                 # it". Was 8.
                                 # Position COUNT was never a risk measure —
                                 # eight $250 positions and eight $25,000 ones
                                 # are the same number and wildly different
                                 # exposure. It only LOOKED like a rail because
                                 # the $2k order clamp made every position the
                                 # same size.
                                 # What bounds the book now: max_portfolio_heat_pct
                                 # (total stop-risk), max_position_pct (per name),
                                 # correlation_cap (co-moving names are one bet),
                                 # max_drawdown_pct (peak-to-trough halt) and
                                 # buying power. All were already here; all were
                                 # inert behind the clamp.
                                 # COUNTER-EVIDENCE ON RECORD: §12 measured tsmom's
                                 # profit factor DEGRADING as slots rise —
                                 # 2.398 -> 1.977 -> 1.730 — while return rises.
                                 # More positions has a known cost in trade
                                 # quality. That is what §29 gates.
  min_universe_fraction: 0.8     # UNIVERSE FLOOR (2026-08-06): if fewer than this
                                 # fraction of the symbols the cycle ASKED for end up
                                 # with usable bars, block ENTRIES; exits always run.
                                 # 0 disables.
                                 #
                                 # The total-outage case is already covered and this is
                                 # NOT it: on 2026-07-31 the laptop lost DNS, every
                                 # symbol failed inside 40ms, SPY was therefore missing
                                 # and the cycle aborted on the stale-SPY rail. What was
                                 # open is the PARTIAL band, and it has fired: the
                                 # ledger's only data_error in its whole history is QQQ
                                 # dropping out mid-cycle on 2026-08-05, after which the
                                 # bot traded 37 of 38 names with nothing recorded as
                                 # blocked. That is divergence #17 (500 in sim vs 38
                                 # live) re-enacted inside live.
                                 #
                                 # 0.8 would NOT have blocked that cycle, deliberately —
                                 # 1-of-38 is a symbol, 12-of-38 is a broken feed. The
                                 # 1-symbol case is made visible instead, by a
                                 # universe_truncated event that blocks nothing.
  max_bar_age_days: 4            # FRESHNESS GUARD: refuse to trade if the newest bar is
                                 # older than this many calendar days (covers weekends +
                                 # a holiday). 0 disables. Guards against the stale-data
                                 # API failure mode observed 2026-07-16.
  max_portfolio_heat_pct: 4.0    # PORTFOLIO HEAT CAP (2026-07-21): total open
                                 # stop-risk (sum of qty x entry-to-stop across the
                                 # book) + a new entry's risk may not exceed this % of
                                 # equity. Entries only. 0 disables.
                                 # (Briefly raised to 10.0 on 2026-07-22 and REVERTED
                                 # the same day. The REVERT STANDS. Its stated
                                 # arithmetic does not, and is corrected rather than
                                 # deleted [W1-3, 2026-07-29].
                                 #
                                 # WHAT IT ARGUED: the cap could not bind, because
                                 # max_order_value_usd clamped every position to $2k
                                 # first, so four open positions totalled ~$560 of
                                 # stop-risk against a $4,000 cap.
                                 #
                                 # WHY THAT NO LONGER HOLDS: that clamp is 0 =
                                 # DISABLED since §29 (:197). The per-name bound is now
                                 # max_position_pct: 10.0 — ~$10k on $100k equity, five
                                 # times the old ceiling — and risk_per_trade_pct rose
                                 # 1.0 -> 8.0 in the same decision. The ~$560 figure is
                                 # history. W1-0b instrumented the shipped config and
                                 # measured $1,777,533 of accumulated stop-risk across
                                 # 465 heat evaluations, every dollar of it real: 0 of
                                 # 244,920 entries lacked a stop, so the heat number is
                                 # genuine book risk and not a stopless fallback.
                                 #
                                 # SO: this cap now operates in a regime nobody has
                                 # gated. Whether 4.0 is the right number is UNMEASURED
                                 # — do not read the old ~$560 line as evidence that it
                                 # is slack. Raising it still needs its own registered
                                 # gate; that is the rule, and it is the reason the
                                 # 2026-07-22 revert survives its own broken reasoning.
                                 # Separately, §40 measured that the DRAWDOWN rail, not
                                 # heat, is what holds deployment down: it accounts for
                                 # 94-99% of blocked signals in three of four periods.)
  data_crosscheck:               # SECOND-VENDOR PRICE CHECK (2026-07-21): SPY's
    enabled: true                # latest close compared Alpaca vs yfinance each
    max_divergence_pct: 0.5      # cycle. Same-session divergence beyond this % =>
                                 # one feed is lying => degradation event + entries
                                 # blocked that cycle (exits never blocked). A vendor
                                 # outage fails open silently — the rail fires only
                                 # when both vendors report and DISAGREE.
  live_kill:                     # PRE-REGISTERED LIVE KILL CRITERIA (2026-07-21):
    enabled: true                # the live-side mirror of the backtest enablement gate.
    min_trades: 15               # A strategy with >= min_trades LIVE closed trades and
    pf_below: 0.8                # profit factor < pf_below stops ENTERING (exits always
                                 # run). Registered while every strategy is far from the
                                 # threshold, so it cannot be argued with later.
  sector_concentration:          # SECTOR CONCENTRATION CAP (2026-08-05, with `reclaim`).
    enabled: true                # At most `max_per_sector` open positions whose
    max_per_sector: 3            # symbol appears in the same `sectors:` entry.
                                 # ENTRIES only; exits are never blocked.
                                 #
                                 # `reclaim` hunts one sector at a time by
                                 # construction, so without this the book could
                                 # become four names in one sector — one bet
                                 # wearing four tickers, which is the exact
                                 # thing correlation_cap below exists to stop,
                                 # arriving through a door it does not watch
                                 # (it measures realised co-movement, not
                                 # membership, and 60 bars of correlation can
                                 # miss a sector that has only just started
                                 # moving together).
                                 #
                                 # A symbol in NO sector is unconstrained here —
                                 # the core universe is not sector-mapped, so
                                 # this rail is inert for every existing
                                 # strategy and cannot change their behaviour.
                                 #
                                 # 3 is PRE-REGISTERED, not fitted: it is the
                                 # top of the owner's stated 2-3 range. Which of
                                 # this and correlation_cap binds first is a
                                 # MEASUREMENT the DIAGNOSTIC makes, not a guess
                                 # to be argued about now.
  correlation_cap:               # CORRELATION HEAT CAP (2026-07-21, EastEquity review):
    enabled: true                # "co-moving names are one bet." A new buy is blocked
    lookback: 60                 # when >= max_correlated open positions have >= threshold
    threshold: 0.85              # Pearson correlation of daily returns with it over the
    max_correlated: 2            # lookback window. Entries only; fail-open without bars.
  max_contraction_pctile: 0      # §58 VOLATILITY-CONTRACTION PRECONDITION — OFF.
                                 # Blocks an entry unless the last 20 bars' high-to-low
                                 # range, as a fraction of price, sits at or below this
                                 # percentile of its own trailing year. 10 would mean
                                 # "only names quieter than 90% of their own last year".
                                 #
                                 # 0 = disabled, the same convention as min_rvol, and it
                                 # ships disabled for that key's exact reason: the idea has
                                 # not passed a gate, and config.yaml IS the live artifact.
                                 # §58 registers it DIAGNOSTIC, which licenses nothing.
                                 #
                                 # No bespoke code path exists — the shared rail
                                 # risk.contraction_blocked() already runs for every
                                 # strategy in main.py's entry loop and in both simulators
                                 # and reads this key, so enabling it is one value.
                                 #
                                 # IT COSTS HISTORY. Any non-zero value moves
                                 # strategies.max_lookback_bars from 253 to 272, because a
                                 # rail starved of bars fails OPEN and silently blocks
                                 # nothing. Per-strategy override:
                                 # strategies.<name>.max_contraction_pctile.
  contraction_period: 20         # bars in the range window — the "coil" itself
  contraction_lookback: 252      # trailing windows it is ranked against (~one year)
  max_entry_drift_bps: 100       # ENTRY DRIFT GUARD (2026-07-21): skip a buy when the
                                 # live quote is >1% away from the price the signal saw.
                                 # Order-level backstop behind the freshness guard — every
                                 # 2026-07-16 stale-bars fill would have been blocked here.
                                 # Entries only (exits never blocked). 0 disables.
  min_holding_days: 2            # SWING GUARD: exits blocked until a position is at least
                                 # this many calendar days old — makes day trading impossible.
                                 # (The daily-loss kill switch is exempt: safety wins.
                                 # Broker-side bracket legs below are also exempt — they are
                                 # protective orders set deterministically at entry.)
  brackets:                      # protective stop-loss / take-profit legs on every entry
    enabled: true                # verified via paper cycle 2026-07-14
    atr_period: 14               # ATR lookback (daily bars)
    stop_atr_mult: 2.0           # stop  = entry − 2.0 · ATR
    take_profit_atr_mult: 0      # stop-only (OTO): every walk-forward winner chose no
                                 # TP leg — capping winners hurt in and out of sample
    trailing_atr_mult: 3.0       # chandelier trail: stop ratchets to high-water −
                                 # 3·ATR, never down. Gate 2026-07-19 (§7, frozen
                                 # snapshot, pre-registered): ADOPTED for tsmom
                                 # (OOS +1.38→+2.37, maxDD 0.7→0.5 — the
                                 # Kaminski-Lo momentum prediction held); REJECTED
                                 # for meanrev (maxDD tie, +0.01pp noise — exits
                                 # already fast).
    trailing_strategies: [tsmom] # trail applies only to positions OWNED by these
    time_in_force: gtc           # legs must survive across days (DAY would expire overnight)
  vol_target:                    # volatility-targeted sizing. Gate 2026-07-18:
    enabled: false               # ADOPTED for meanrev only (marginal) — then
    strategies: [meanrev]        # SUPERSEDED 2026-07-19 by risk_sizing below,
                                 # which beat it head-to-head on the same frozen
                                 # snapshot for its only scoped strategy
                                 # (meanrev OOS +2.38 vs +1.10). Both normalize
                                 # by realized vol, so only one may be active.
    annual_vol: 0.20             # target annualized vol; size scales by target/realized
    period: 20                   # realized-vol lookback (daily bars)
    min_scale: 0.5               # clamp so sizing never swings more than 2x either way
    max_scale: 1.5
  margin:                        # §64 SIMULATOR margin model — arms only.
    multiplier: 1.0              # 1.0 = cash account, byte-identical to the
                                 # pre-§64 code. >1.0 exists so a FROZEN SPEC
                                 # ARM can test financed leverage; the live
                                 # Alpaca account is cash-sized and nothing in
                                 # main.py reads this block. Financing on
                                 # negative cash is charged at the ^IRX aux
                                 # rate + spread, and FAILS CLOSED to
                                 # flat_rate_pct — a levered arm with free
                                 # borrow is divergence #16 wearing a new name.
    spread_bps_annual: 150       # broker spread over the T-bill rate
    flat_rate_pct: 6.0           # punitive fallback when no rate aux is given
  macro_gate:                    # §64 macro regime gate — OFF. Exists so a
    enabled: false               # frozen spec arm can test entry-blocking on
    series: UNRATE               # a first-print ALFRED vintage series. Same
    ma_days: 252                 # four properties as the §31 credit gate:
                                 # shared impl, ts-bounded, fails open,
                                 # never applied to exits.
  regime_exposure:               # down-regime gross-exposure cap. Gate 2026-07-18:
    enabled: true                # §29 2026-07-26: ENABLED, on §18's own condition.
                                 # §18 rejected it as untestable — "at 1%/trade
                                 # sizing gross never nears the cap ... Revisit
                                 # only if sizing scales up." Sizing has now
                                 # scaled 8x and deployment 5% -> 43.6%, so the
                                 # condition §18 itself named is met.
                                 # Measured at risk_per_trade_pct 8.0, OOS:
                                 #   off      -> +17.45%  PF 1.549  maxDD 7.51%
                                 #   50% cap  -> +20.25%  PF 1.694  maxDD 5.71%
                                 # Better return, better PF, LOWER drawdown —
                                 # return/maxDD 2.32 -> 3.55. Unlike the sizing
                                 # raise, this is a real risk-adjusted gain, and
                                 # it is the documented momentum-crash behaviour
                                 # (Kaminski-Lo, Daniel-Moskowitz): trend books
                                 # bleed when the trend inverts, so cutting gross
                                 # in a down regime protects the tail.
                                 # ADOPTED AT 50, NOT 30. A 30% arm scored better
                                 # still (+22.55%, PF 1.791, maxDD 4.90%) but 50
                                 # is the value §18 had already configured, while
                                 # 30 was chosen by me AFTER seeing the OOS result
                                 # — testing two values and keeping the winner is
                                 # in-sample selection on the holdout. It is
                                 # registered as a §30 candidate instead.
    down_max_gross_pct: 50       # in a down-trend regime, total position value <= 50% equity
  risk_sizing:                   # stop-distance sizing: dollars = equity·risk_pct /
    enabled: true                # stop-distance-fraction (equal TRUE risk per
                                 # trade, Van Tharp school). Gate 2026-07-19 (§8):
                                 # ADOPTED for meanrev (OOS +1.10→+2.38, maxDD
                                 # 0.2→0.3 within tolerance, IS improves; also
                                 # beats + replaces vol_target); REJECTED for
                                 # tsmom (maxDD 0.7→1.1 breaks the rule).
    risk_pct: 5.0                # % of equity truly at risk entry-to-stop.
                                 # SEE THE CLAMP NOTE BELOW — it is HISTORY, not
                                 # current behaviour.
                                 # Owner override 2026-07-22 (was 0.1), re-validated
                                 # 2026-07-23 on the §8 frozen snapshot — see
                                 # knowledge/backtest_candidates.md §11. Passes the
                                 # §8 rule vs the 0.1 baseline (OOS +2.63 vs +2.24,
                                 # maxDD 0.5 vs 0.3 <= +0.25pp, IS +1.87 vs +1.34).
                                 #
                                 # CLAMP NOTE — the clamp CHANGED on 2026-07-26; the
                                 # note is corrected here rather than deleted
                                 # [W1-3, 2026-07-29], because §11's byte-identical
                                 # finding is unintelligible without it.
                                 #
                                 # WHAT IT SAID (true until §29): size_order() applied
                                 # max_order_value_usd ($2,000) AFTER this calculation,
                                 # so on $100k equity a meanrev entry was capped at a
                                 # $2,000 position and risked ~$80-300 (0.08-0.3% of
                                 # equity), not $5,000. risk_pct 1.0, 2.0 and 5.0 came
                                 # out BYTE-IDENTICAL in backtest for exactly that
                                 # reason; only 0.1 (which sized under the cap at wide
                                 # stops) differed.
                                 #
                                 # WHAT IS TRUE NOW: max_order_value_usd is 0 =
                                 # DISABLED (:197). The number is STILL aspirational —
                                 # src/risk.py:339-344 clamps this path by
                                 # max_position_pct: 10.0, so a meanrev entry is bounded
                                 # at ~$10k on $100k equity and true entry-to-stop risk
                                 # is ~0.5% of equity at a 5%-wide stop, not 5%. What
                                 # changed is the SIZE of the ceiling: ~$10,000 instead
                                 # of $2,000, five times higher. So the old note's
                                 # conclusion survives; its arithmetic does not.
                                 #
                                 # NOT COVERED BY §29. §29's arm C swept
                                 # risk.risk_per_trade_pct (:167, adopted at 8.0) — a
                                 # DIFFERENT field, on the notional path at risk.py:325.
                                 # This risk_sizing.risk_pct is the meanrev-only
                                 # stop-distance path at risk.py:323 and was not an arm
                                 # in that sweep. Whether 5.0 is right against a 10%
                                 # concentration cap is therefore still ungated; it is
                                 # bounded, not validated.
    strategies: [meanrev]        # per-strategy scope from the gate
  reentry_cooldown:              # same-ticker re-entry cooldown after an exit
    days: 5                      # (anti-whipsaw). Gate 2026-07-19 (§9): ADOPTED
    strategies: [meanrev]        # for meanrev (PF 2.16→2.25, dd/return hold, IS
                                 # −0.02→+0.50); REJECTED for tsmom (maxDD
                                 # 0.7→1.0 despite PF 4.0 — rule is the rule).
                                 # Combined meanrev overlay (sizing + cooldown)
                                 # verified on the snapshot: OOS +2.24 PF 2.28.

  # NET exposure band for the 130/30 book (Phase 1, 2026-08-04). COMMENTED OUT
  # until a strategy actually shorts — an unconfigured band is off, and turning
  # it on before there are shorts would only ever constrain buys.
  #
  # DIRECTIONAL: `max` constrains buys, `min` constrains shorts. Never both on
  # one order. §48 measured deployment at 4.72% with the drawdown rail engaged,
  # so a floor applied to buys would reject every entry and the book could not
  # climb back into its own band.
  #
  # net_exposure_pct:
  #   min: 80      # floor on net — stops the short leg pulling the book neutral
  #   max: 120     # ceiling on net — stops the long leg drifting past 130/30

llm:                   # optional judgment layer (Anthropic API)
  enabled: true        # if false (or no ANTHROPIC_API_KEY), signals execute rule-based only
  provider: local      # `anthropic` or `local`. Preflight refuses any other name
                       # outright rather than letting a typo reach the cycle.
                       #
                       # `local` (2026-08-23) talks to an OpenAI-compatible
                       # server the operator hosts — the Bizon runs
                       # qwen3.8-27b on vLLM — and uses NO API key. It needs
                       # llm.base_url set, and preflight refuses if it is not:
                       # a keyless provider with no endpoint has nowhere to
                       # send the prompt, and guessing a default would send it
                       # somewhere nobody chose.
                       #
                       # SWITCHED 2026-08-28, and the honest ordering was not
                       # followed. The plan was shadow-first: measure whether
                       # the local model agrees with Claude on real signals
                       # (src/llm_shadow.py), THEN switch. That comparison
                       # needs Anthropic to answer, and Anthropic is exactly
                       # what ran out — so the baseline cannot be collected
                       # until the thing it was meant to de-risk is already
                       # unnecessary. Waiting for it meant not trading at all:
                       # `on_unavailable: block` had refused every entry since
                       # 2026-08-21 and the book had drained 22 -> 15.
                       #
                       # So this judge is UNMEASURED against the one whose
                       # record the bot carries. Divergence #25. What is known
                       # is only what four probe calls showed: valid schema,
                       # verdict inside the allowed set, and a visibly
                       # different disposition — scale 0.3-0.5 where the
                       # fitted Claude distribution sits at mean_scale 0.595.
                       # That is a reason to distrust the calibration, which
                       # backtest.judge_model.context_version now refuses, not
                       # a measurement of agreement.
  base_url: http://vllm-qwen38:8000/v1   # required when provider is
                       # keyless, ignored otherwise. Container-to-container on
                       # the Bizon's `ollama-net`; nothing leaves the host, so
                       # there is no key here and nothing to rotate.
  enable_thinking: false # vLLM serves qwen3 with --reasoning-parser=qwen3, so
                       # the model will generate a long reasoning trace unless
                       # told not to. Measured on the real judge prompt: 47.1s
                       # / 2261 completion tokens with it, 4.8s / 224 without,
                       # SAME VERDICT. The extra tokens are prose llm.py's
                       # `{`..`}` slice discards, and no ledger field records
                       # them — the latency bought something unauditable.
                       #
                       # It is also load-bearing, not a tuning nicety: at 47s
                       # every call blew the 30s timeout_seconds below and came
                       # back a degradation, which is the same blocked-entry
                       # state this switch exists to end. null = send nothing
                       # (any non-vLLM server); see llm_client.thinking_kwargs.
  fallback_model: null # retry ONCE on this model when the primary one errors.
                       # Unset on purpose: a quietly weaker judge is a trading
                       # behaviour change, and it does nothing about a bad key —
                       # which is the failure that actually happened 2026-07-27.
  model: qwen3.8-27b      # judge/posts/journal. The id vLLM SERVES, not an
                          # alias — `provider: local` sends this string
                          # straight to the endpoint above, and a name that
                          # host does not serve is a 400, not a fallback.
                          #
                          # Was claude-sonnet-5, right-sized 2026-07-18 from
                          # claude-fable-5 on contamination-controlled evals
                          # (arXiv 2510.02209, 2511.03628), which find no
                          # thinking/frontier edge for trading-judge roles.
                          # That reasoning is about model CLASS and says
                          # nothing about a 27B open-weight model; treat the
                          # earlier finding as not transferred here.
                          #
                          # config.yaml is inside modelver's fingerprint, so
                          # this line alone re-versions the decision surface
                          # and review.py segments the record at the switch.
                          # Nothing has to remember to mark it.
  max_tokens: 4000        # roomy — replies truncate otherwise
  timeout_seconds: 30     # wall-clock ceiling on ONE judge call. The SDK's own
                          # default is 600s, which inside a cycle means a hung
                          # vendor can hold execution for TEN MINUTES PER
                          # SIGNAL and push fills past the close. Observed
                          # latency is single-digit seconds, so 30 is generous.
                          # Non-positive or unparseable values fall back to the
                          # 30s default rather than restoring an unbounded call.
  on_unavailable: block   # what to do with an ENTRY the judge could not judge
                          # (key absent, API error, unusable reply).
                          #
                          # CHANGED approve -> block on 2026-08-21 (owner
                          # decision, audit remediation). The measurement that
                          # moved it: SIX live entries were taken at FULL SIZE
                          # with no risk review, and those six were 100% of the
                          # `approve` verdicts in the judgment ledger. The judge,
                          # on every occasion it was actually reached, never once
                          # approved at full size — every genuine verdict was a
                          # downsize or a veto. So fail-open was not a rare edge
                          # case; it was the only path by which this bot ever
                          # recorded an approval, and those entries were sized
                          # larger than any trade the judge ever blessed.
                          #
                          #   approve — degrade to full-size rule-based
                          #             execution. THE HISTORICAL DEFAULT: every
                          #             result in knowledge/backtest_candidates.md
                          #             was produced under it, and the judge has
                          #             never been evidenced to add edge, so an
                          #             unjudged trade is not a known-worse one.
                          #   block   — refuse the entry. The judge may only ever
                          #             SHRINK risk, so an outage removes a
                          #             risk-reducer and nothing else; this is
                          #             for an owner who would rather the book
                          #             stand still than trade unsupervised.
                          # EXITS ALWAYS RUN either way — blocking a sell because
                          # the reviewer is down would trap a position and
                          # ENLARGE risk through the reviewer's absence.
  pricing:                # USD per MILLION tokens, by SERVED model id (2026-08-22).
                          # Read by llm_client.estimate_cost_usd for every judge
                          # call; the result lands on the decision record as
                          # cost_usd. In config, not code, because a stale price
                          # table producing confident wrong numbers is worse
                          # than None — and a model absent here yields None,
                          # never 0.0, so "unpriced" can never read as "free".
                          #
                          # VERIFIED 2026-08-22 against the Claude API reference.
                          # Sonnet 5 is on INTRO pricing through 2026-08-31
                          # ($2/$10); the standard rate after is $3/$15.
                          # Re-verify on 2026-09-01 and bump the input/output
                          # figures, or the September cost report understates.
                          # Cache-read rates omitted until verified; the
                          # estimator ignores cache tokens when the key is absent.
    claude-sonnet-5:   {input_per_mtok: 2.00,  output_per_mtok: 10.00}
    claude-haiku-4-5:  {input_per_mtok: 1.00,  output_per_mtok: 5.00}
    claude-fable-5:    {input_per_mtok: 10.00, output_per_mtok: 50.00}
  knowledge_path: knowledge/principles.md  # curated external principles fed to the
                          # review prompt, labeled unverified; comment out to disable
  knowledge_max_context_chars: 1500
                          # OWN budget (2026-08-04), RAISED 1000 -> 1500 on
                          # 2026-08-11 (§61). It was invisible and nearly
                          # binding: principles.md had reached 906 of 1000 chars,
                          # and the next principle added would have been dropped
                          # off the end with no error. Same trap
                          # news.memory.max_context_chars exists to avoid. By
                          # 2026-08-11 the file was at exactly 1000 of 1000 —
                          # zero headroom, and knowledge could not grow at all.
                          #
                          # This comment used to read "DO NOT RAISE IT casually",
                          # because context_for_llm capped the WHOLE block at
                          # learning.max_context_chars and the sub-budgets
                          # oversubscribed that total, so every extra char here
                          # came off the tail. THAT WAS CORRECT AT THE TIME and
                          # is kept here rather than deleted: lessons took // 2
                          # and market context and the scoreboard // 4 each,
                          # which is exactly 100% of the cap before knowledge,
                          # news memory, the book, the trades, calibration or
                          # the regime label got anything.
                          #
                          # §61 fixed the constraint rather than working around
                          # it. Every block now has a NAMED budget (see
                          # learning.context_budgets) and learning.max_context_
                          # chars covers their sum, so growth here no longer
                          # costs the tail. Preflight warns if that stops being
                          # true and a context_evicted ledger event fires if the
                          # cap ever bites at runtime.
                          #
                          # tests/test_principles_context.py reads the SHIPPED
                          # config and fails if the file outgrows this or drops
                          # below 300 chars of headroom, so both truncation and
                          # a silently-full budget are red builds.
  # The LLM may only VETO or DOWNSIZE a trade, never enlarge or invent one.

news:                  # market awareness (Alpaca News API + LLM distill),
                       # refreshed hourly 9:25-15:25 ET (com.repete.newsbrain)
                       # plus on-demand at the 9:35 plan post when missing
  enabled: true
  model: null          # NULLED 2026-08-28 with the switch to `provider: local`.
                       # llm_client resolves `model or llm.model`, so null
                       # routes this at the one id the local server actually
                       # serves. Left as claude-haiku-4-5 it would post a model
                       # name vLLM does not have and take a 400 every hour —
                       # a Claude name under a local provider is not a
                       # cheaper model, it is a broken request.
                       #
                       # The cost argument this override existed for is moot:
                       # a self-hosted model is $0/hour, so there is nothing
                       # left to distill down to. Restore the override with
                       # the provider if Anthropic comes back.
  max_headlines: 50    # TOTAL raw headlines fed to the distiller (last 24h).
                       # This is the budget, NOT the Alpaca request limit — it
                       # was both until 2026-07-29 (W6-A0) and that was a live
                       # bug: `(alpaca + rss)[:max_headlines]` with Alpaca
                       # returning exactly 50 discarded EVERY RSS item. Measured
                       # that day: alpaca 50, rss 45 fetched (WSJ 20, CNBC 15,
                       # MarketWatch 10), rss surviving the slice ZERO, and the
                       # distiller saw 50 headlines all from `benzinga`. The
                       # feeds worked perfectly; nothing consumed them.
  alpaca_max_headlines: 30   # wire request limit. 30/50 keeps Alpaca the
                       # majority, which is what symbol_flags needs — its items
                       # are the only ticker-TAGGED ones; RSS carries no tickers.
  rss_reserved_slots: 20     # floor for RSS, round-robined across sources so the
                       # source YAML happens to list first can't eat the share
                       # (the ordering trap §24 found in the symbol scan).
                       # RESERVED, NOT FIXED: unused slots go back to Alpaca, so
                       # a dead-feed morning doesn't shrink the prompt — and the
                       # reverse holds when the wire is down. Owner's split,
                       # 2026-07-29. No gate: news inputs aren't backtestable,
                       # so this is a documented judgement, not a validated one.
  max_nominations: 3   # watchlist symbols the news may point the scanners at.
                       # NOMINATION != TRADE: entries still require a real
                       # deterministic strategy signal + judge (extra
                       # skepticism, outside backtested universe) + all rails.
  max_news_entries_per_cycle: 1   # hard cap on executed news-nominated entries
  context_path: memory/market_context.json  # today-only; stale context ignored

  # W7 (2026-07-30). Until now every refresh OVERWROTE context_path and nothing
  # remembered anything: the judge could not tell a symbol in the headlines for
  # the fourth day running from one mentioned once, and no record existed of
  # whether attending to news ever helped a trade.
  #
  # The ONLY consumer is memory.context_for_llm() -> the judge. Under invariant
  # #2 the judge may veto or shrink and may NEVER enlarge, so this can stop a
  # trade and cannot create one. Nominations are deliberately NOT influenced —
  # that path does create trades and was left alone.
  #
  # UNGATED, and honest about it: this is not an EDGE attempt at all, and the
  # EDGE tally is unchanged by it — knowledge/backtest_candidates.md owns that
  # count. It is the instrumentation that makes a §46 possible, because the outcome
  # records give a future gate its two populations (entered-with-news vs
  # without). It also creates sim/live divergence #14 ON PURPOSE — the live
  # judge sees this block, the backtest's judge_model cannot, and there is no
  # historical news archive to replay. See docs/divergences.md #14.
  #
  # `enabled: false` must restore byte-identical judge context. That is asserted
  # in tests/test_news_memory.py, not merely intended.
  memory:
    enabled: true
    path: memory/news_memory.jsonl
    retention_days: 30      # older mentions drop out of the judge's view
    max_context_chars: 600  # OWN budget — a block without one silently eats
                            # the tail of learning.max_context_chars and
                            # truncates whatever sorts after it
    max_rows: 6             # most recent mentions shown per symbol
    min_mentions_to_show: 1

  rss_sources:           # FREE PUBLIC RSS feeds (headline + 1-2 sentence summary
                         # only). NO login, NO scraping, NO credentials — merged
                         # into the news brain alongside Alpaca. Each source is a
                         # named group of {Section: url}; label = "Source:Section".
                         # Full-text articles would need a licensed API (not this).
    WSJ:                 # live Dow Jones host (feeds.a.dj.com froze Jan 2025);
                         # verified fresh 2026-07-20, titles = genuine WSJ.com feeds
      enabled: true
      max_items: 20      # cap on total headlines from this source (keeps Alpaca's
                         # ticker-tagged items dominant for symbol_flags)
      max_per_feed: 8
      max_age_hours: 36  # drop stale RSS items
      feeds:
        Markets:  https://feeds.content.dowjones.io/public/rss/RSSMarketsMain
        Business: https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness
        Tech:     https://feeds.content.dowjones.io/public/rss/RSSWSJD
        World:    https://feeds.content.dowjones.io/public/rss/RSSWorldNews
    CNBC:                # cnbc.com public RSS; verified fresh 2026-07-20
      enabled: true
      max_items: 15
      max_per_feed: 6
      max_age_hours: 36
      feeds:
        Finance:   https://www.cnbc.com/id/10000664/device/rss/rss.html
        Investing: https://www.cnbc.com/id/15839069/device/rss/rss.html
        Economy:   https://www.cnbc.com/id/20910258/device/rss/rss.html
        Business:  https://www.cnbc.com/id/10001147/device/rss/rss.html
    MarketWatch:         # Dow Jones public feeds, same live host as WSJ; verified
                         # fresh 2026-07-21. mw_realtimeheadlines + mw_marketpulse
                         # are FROZEN (mid-2025) on this host — deliberately excluded.
      enabled: true
      max_items: 10
      max_per_feed: 6
      max_age_hours: 36
      feeds:
        TopStories: https://feeds.content.dowjones.io/public/rss/mw_topstories
        Bulletins:  https://feeds.content.dowjones.io/public/rss/mw_bulletins
    Bloomberg:           # verified live 2026-07-29 through market_context's own
                         # parser, not just curl: 12 items, real headlines,
                         # newest 22:01 GMT. Titles are CDATA-wrapped, which
                         # ElementTree handles; the feeds 301 to
                         # www.bloomberg.com/feeds/... and urllib follows it.
      enabled: true
      max_items: 12
      max_per_feed: 4
      max_age_hours: 36
      feeds:
        Markets:    https://feeds.bloomberg.com/markets/news.rss
        Economics:  https://feeds.bloomberg.com/economics/news.rss
        Technology: https://feeds.bloomberg.com/technology/news.rss
    FT:                  # verified live 2026-07-29 the same way: 12 items,
                         # newest 23:01 GMT. `?format=rss` is the live path;
                         # /rss/home 301s to it.
      enabled: true
      max_items: 12
      max_per_feed: 4
      max_age_hours: 36
      feeds:
        Markets:   https://www.ft.com/markets?format=rss
        Companies: https://www.ft.com/companies?format=rss
        US:        https://www.ft.com/world/us?format=rss
    Fed:                 # THE PRIMARY SOURCE, not a commentator on it. Verified
                         # 2026-08-04 through market_context._fetch_rss_source:
                         # 4 items over a 168h window, including "Federal Reserve
                         # issues FOMC statement" (Wed 29 Jul 2026 18:00 GMT).
                         #
                         # AT THE STANDARD max_age_hours: 36 IT RETURNS ZERO ON A
                         # QUIET WEEK, and that is the intended behaviour, not a
                         # broken feed. Measured the same day: 0 items at 36h,
                         # 0 at 72h, 4 at 168h. The Fed publishes ~8 FOMC
                         # statements a year; on the days that matter the
                         # statement is minutes old and lands well inside 36h.
                         #
                         # 36h AND NOT 168h ON PURPOSE. llm.py's distiller prompt
                         # is headed "HEADLINES (last 24h)". A week-wide window
                         # would put six-day-old macro in a payload whose own
                         # header says otherwise — the item carries a true `ts`,
                         # so the prompt would contradict its own data and the
                         # model would have to pick. Widening this means fixing
                         # that prompt first, which is a live LLM change with no
                         # gate in front of it.
                         #
                         # AN EMPTY SOURCE COSTS NOTHING. Verified against
                         # merge_budget: with Fed present-but-empty the merge is
                         # byte-identical to Fed absent (alpaca 30 / rss 20); a
                         # live Fed takes from the RSS reserve, not from Alpaca.
      enabled: true
      max_items: 4       # low volume by nature — a cap this size cannot crowd
      max_per_feed: 2    # the wires out even on a heavy Fed week
      max_age_hours: 36
      feeds:
        Monetary: https://www.federalreserve.gov/feeds/press_monetary.xml
        Press:    https://www.federalreserve.gov/feeds/press_all.xml
    # REQUESTED AND REJECTED, 2026-08-04 — both tested the same way, neither usable:
    #   SEC EDGAR HTTP 403 on the getcurrent 8-K atom feed. The SEC requires a
    #             declared User-Agent carrying a real contact address and
    #             rejects the browser UA in market_context._UA. Supplying one
    #             means putting the owner's email in config and a per-source UA
    #             in the fetcher — and the 8-K firehose is every filer's every
    #             filing, which is noise this bot has no way to rank.
    #   BLS       HTTP 403 on bls_latest.rss, same cause.
    # REQUESTED AND REJECTED, 2026-07-29 — each tested, none usable:
    #   Reuters   401 on every path. Blocked to non-subscribers.
    #   Barron's  404 on every Dow Jones path (RSSBarrons*, bar_topstories,
    #             barronsonline). Paywalled; no public feed on the host WSJ and
    #             MarketWatch share.
    #   AP        HTTP 200 with 1.7 MB of `<!DOCTYPE html>` — a webpage, not a
    #             feed. THIS is the cautionary one: a fetcher trusting the
    #             status code would have called it a success and contributed
    #             nothing, silently, forever. Our parser rejects it (`not
    #             well-formed`) and W6-A1 now RECORDS that rejection, which is
    #             the only reason it would ever be noticed.
    # Do not re-add any of the five without re-testing through
    # market_context._fetch_rss_source and pasting the item count here.

x_posting:                # despite the name, this section is the BLOG + JOURNAL
                          # pipeline. X is one optional sink hanging off it.
  enabled: false       # X OFF, owner's decision 2026-07-28: "dont worry about it
                       # posting on X as long as it posts on its own blog in the
                       # journal." The bot still composes every post and writes it
                       # to posts_log_path with status `x_disabled`, so blog.html
                       # and journal.html are UNAFFECTED — that decoupling landed
                       # in the same change (src/x_poster.py archives before it
                       # delivers). Turning this back on needs the four X_* values
                       # in .env; they were empty from ~2026-07-24, which is what
                       # started all of this.
  dry_run: true        # PRINT, never deliver (W5-2, 2026-07-29). Was `false`.
                       #
                       # TWO FLAGS, BOTH MUST BE TURNED OVER DELIBERATELY.
                       # Until today `enabled: false` was the ONLY thing between
                       # this bot and a real public post, and it sits in a
                       # section whose name says "x_posting" while actually
                       # governing the BLOG and JOURNAL. Someone flipping
                       # `enabled` to get the blog working — not realising X
                       # rides the same block — would have started tweeting.
                       #
                       # Costs nothing: X delivery is already off, and the blog
                       # and journal are decoupled from it by design
                       # (src/x_poster.py archives before it delivers, so every
                       # composed post reaches posts_log_path as `x_disabled`).
                       #
                       # `disclose_paper: true` below stays true whatever these
                       # two do. Posting paper results as real is what the FTC
                       # fined Warrior Trading $3M for.
  post_style: recap    # recap = per-trade post with reasoning
  hashtags: "#papertrading #tradingbot"
  disclose_paper: true # always disclose paper trading in posts (keep this true — honesty matters)
  journal_path: memory/journal.jsonl   # append-only 500-word trade write-ups
  posts_log_path: memory/posts.jsonl   # append-only archive of every post the bot
                                       # writes -> rendered into the public blog,
                                       # whatever became of it on X
  journal_url_base: https://reformatic-ai.github.io/repete-dashboard/journal.html
                       # public journal page. Each trade's write-up is anchored
                       # at #<trade_id>, which is what a post links to when X
                       # is on. Said "trade tweets link to" until 2026-07-29 —
                       # true when written, stale since X went off.

publish:                # WHERE the public artifacts are written. One answer, so
                        # nothing can write them by accident.
  out_dir: "."          # dashboard.html, dashboard_data.json, blog.html and
                        # journal.html land here. "." is the repo root, which is
                        # what production wants — scripts/run_cycle.sh cd's there
                        # before every render.
                        #
                        # This key exists because on 2026-07-28 the repo-root
                        # blog.html and journal.html were silently replaced by
                        # TEST FIXTURES: 2,456 bytes where the published copy had
                        # 16,570, and 2,533 where it had 62,354. All nine
                        # production render call sites omitted out_path, so every
                        # one of them resolved against the PROCESS WORKING
                        # DIRECTORY. Running pytest from the repo root was enough.
                        # scripts/publish_dashboard.sh would then have pushed four
                        # duplicate fake posts over an 11-day public archive.
                        #
                        # The artifacts are gitignored, so `git status` stayed
                        # clean and src/deploycheck.py — which reads
                        # `git status --porcelain` — could not have seen it.
                        # tests/conftest.py now points this at a tmp path, which
                        # makes the repo-root write UNREACHABLE from the fixture
                        # rather than merely unused by it.

backtest:               # offline harness (src/backtest.py) — never touches the live ledger
  slippage_bps: 5       # applied against you on every simulated fill
  fee_per_trade_usd: 0.0
  walk_forward_split: 0.7          # in-sample fraction; the rest is out-of-sample
  trials_path: research/trials.jsonl  # append-only log of EVERY variant tried.
                          # MOVED from memory/ 2026-08-22: memory/ is gitignored,
                          # so a count kept there cannot be checked in CI and
                          # cannot be re-derived by anyone else. Same folder as
                          # registrations.jsonl and verdicts.jsonl, same reason.
  judge_model:            # SIMULATED JUDGE (§29, 2026-07-26) — closes the live
    enabled: false        # half of divergence #8. backtest.py never imports llm
    salt: judge-v1        # (by design), so the judge has been ABSENT from every
    context_version: 3    # WHICH JUDGE THIS DISTRIBUTION DESCRIBES.
                          # 1 -> 2 on 2026-08-23: the judge now reads a
                          # PER-SYMBOL RESEARCH DOSSIER (src/research.py) it
                          # has never had. knowledge/judge_calibration.json was
                          # fitted under version 1, so judge_model now REFUSES
                          # it and every gate run with --judge-model stops
                          # rather than sizing against a judge that no longer
                          # exists. That refusal is the feature.
                          #
                          # 2 -> 3 on 2026-08-28: the judge is a DIFFERENT
                          # MODEL (claude-sonnet-5 -> qwen3.8-27b, self-hosted).
                          # The fit describes a verdict distribution, and the
                          # thing drawing from it was replaced — which is a
                          # bigger break than any context edit, since not one
                          # of the 250 buys behind the fit was judged by this
                          # model.
                          #
                          # NOTE the trigger below said "whenever what the
                          # judge READS changes". Read literally, swapping the
                          # model would NOT have required a bump, because the
                          # inputs were untouched — the guard would have sat
                          # there looking healthy while describing a judge that
                          # no longer existed. Widened to cover WHO reads too.
    calibration_refit_pending: true
                          # DECLARED, not inferred. The bump above outran the
                          # fit, and re-earning one needs new live decisions —
                          # the current fit took 34 days to reach n=250 against
                          # min_sample 50, and the judge has been unreachable
                          # since 2026-08-20. So this state lasts weeks.
                          #
                          # Set back to false by the same change that runs
                          # `scripts/calibrate_judge.py --write`. While it is
                          # true, judge_model refuses and no gate can be scored
                          # with --judge-model. That is correct and it is not a
                          # workaround: the alternative is a gate that reports
                          # numbers about a bot that does not exist.
                          # Bump whenever the judge's verdict distribution
                          # could move: what it READS (a new context block, a
                          # changed budget, a different prompt) or WHO reads it
                          # (a different model, provider, or decoding setting —
                          # `llm.enable_thinking` counts, it changed scale on
                          # the same prompt in the 2026-08-28 probe).
                          # knowledge/judge_calibration.json records the version
                          # it was fitted under and judge_model REFUSES on a
                          # mismatch.
                          #
                          # Causal, not temporal: "is this old?" is the wrong
                          # question. A fit from six months ago is fine if the
                          # judge has not changed, and yesterday's is worthless
                          # if it has. There were already guards against
                          # silently running the judge OFF (_STATS, run_gate
                          # refusing a judge-on verdict with zero activity) and
                          # NONE against running it on with a stale fit.
                          #
                          # Re-fitting needs new live decisions: the current
                          # calibration took 34 days to reach n=250 against a
                          # min_sample of 50. So a bump is a real cost and
                          # should be a deliberate act.
                          # backtest this project has run, while live it cuts
                          # 53.5% of buys at mean scale 0.752. The simulator has
                          # therefore been sizing entries ~33% larger than the
                          # live bot on the majority of trades, and every OOS
                          # number in knowledge/backtest_candidates.md inherits
                          # that.
                          #
                          # It cannot recover WHICH trades the judge would have
                          # cut — nothing can, retroactively. It reproduces the
                          # DISTRIBUTION (knowledge/judge_calibration.json,
                          # regenerate with scripts/calibrate_judge.py), drawn
                          # from a hash of (symbol, ts, salt) so gate re-runs
                          # reproduce byte-identically and adding a symbol to
                          # the universe cannot change the verdict on another.
                          #
                          # Default OFF so every gate run before 2026-07-26
                          # still reproduces. §29 turns it on and records the
                          # deltas; do not flip it silently, the whole document
                          # of past verdicts is denominated in the old setting.
                          #
                          # Changing `salt` redraws every simulated verdict. It
                          # exists to test that a result is not an artifact of
                          # one draw — not to shop for a favourable one.

llm_shadow:              # A/B rig: run candidate judges on the SAME live signal,
                         # log only, never trades. Separate top-level block from
                         # `llm:` on purpose — nothing here can reach an order.
  enabled: false         # SHIPS OFF. Flipping this adds one model call per
                         # candidate per judged signal to the cycle's critical
                         # path (~5s each with enable_thinking false, ~47s
                         # without). At 8-13 signals that is the difference
                         # between fitting inside the cycle and pushing fills
                         # toward the close.
  log_path: knowledge/llm_shadow_log.jsonl
  candidates:            # one row PER CANDIDATE per signal. Comparing two
                         # judges needs them scored on the same signal, and a
                         # signal happens once — re-running a candidate
                         # tomorrow compares two models on two market days,
                         # which measures the market.
    - name: qwen-local
      base_url: http://vllm-qwen38:8000/v1
      model: qwen3.8-27b
      enable_thinking: false   # 47.1s -> 4.8s, same verdict (measured, §78)
      max_tokens: 4000
      timeout_seconds: 60      # local inference is slower than the 30s the
                               # LIVE judge is bounded at; do not shrink to
                               # match, it just produces spurious timeouts
    # A vendor candidate needs credits and llm_client's keyed path, which this
    # module does not speak — it is OpenAI-compatible only. Closing divergence
    # #25 (is qwen worse than the Sonnet it replaced?) runs the other way:
    # replay Claude against the prompt sidecar, which has recorded every live
    # prompt since 2026-09-08.

learning:                # the learning loop: hypothesis book + judge calibration
  model: null            # NULLED 2026-08-28 with the switch to `provider:
                         # local` — same reason as news.model: a Claude id
                         # against the local endpoint is a 400, not a smarter
                         # model. Resolves to llm.model (qwen3.8-27b).
                         #
                         # This IS a real downgrade, and it should be said
                         # plainly rather than buried: weekly lesson
                         # generation/evaluation/merge was on the most capable
                         # model precisely because it is low-volume and
                         # highest-stakes reasoning, and it is now on a 27B.
                         # Lessons feed the judge's own context, so a weaker
                         # lesson writer degrades the judge later, not now.
                         # The honest comparison is not against Fable — it is
                         # against the status quo, where this path has been
                         # producing NOTHING since the credits ran out.
  lessons_path: memory/lessons.jsonl        # append-only hypothesis events
  judgments_path: memory/judgments.jsonl    # every LLM verdict + its later resolution
  promotion_min_supports: 3       # candidate->active: >=3 supports AND supports >= 2x contradicts
  promotion_support_ratio: 2.0
  refutation_min_evidence: 3      # refuted: contradicts >= supports with total evidence >= 3
  staleness_days: 45              # no new evidence in N days -> retired (kept, out of retrieval)
  staleness_tiers:                # FinMem-style tiered decay by lesson scope
    symbol: 21                    # symbol-specific patterns go stale fastest
    strategy: 90                  # strategy/direction-level lessons
    regime: 180                   # regime-level generalizations are most durable
  counterfactual_extra_days: 5    # vetoed buys resolve after min_holding_days + this
  counterfactual_max_per_run: 10  # bars() calls bounded per learn run
  postexit:                       # post-exit runner tracking (src/postexit.py):
    enabled: true                 # every close re-marked later — measurement only,
    path: memory/postexit.jsonl   # feeds review.py + future exit-rule gate evidence
    mark_days: [15, 30, 60]       # calendar days after exit
    left_on_table_pct: 8.0        # winner kept running >= this -> left_on_table
    good_lock_in_pct: -5.0        # faded <= this after our exit -> good_lock_in
    max_marks_per_run: 10         # bars() fetches bounded per cycle
  evaluator_batch_size: 5         # closed trades evaluated per learn.py run
  max_llm_calls_per_cycle: 2      # hard cap on learning LLM calls inside a trading cycle
  top_k_lessons: 8                # lessons injected into the review prompt
  max_context_chars: 13000        # hard cap on the whole memory block.
                                  # 12000 -> 13000 on 2026-08-23 for the
                                  # `research` block. The named budgets summed
                                  # to 10,966 before it; adding 900 left 134
                                  # chars of headroom, and §61's own finding
                                  # was that principles.md sat at 1000 against
                                  # a 1000 budget — "zero headroom, which is a
                                  # different and QUIETER problem than being
                                  # over". A cap the next block cannot fit
                                  # under is a cap that will evict something
                                  # without being changed.
                                  # 4000 -> 12000 on 2026-08-11 (§61). At 4000
                                  # the assembled context measured 5,613 chars
                                  # against the live memory files and the bare
                                  # ctx[:4000] silently dropped NEWS MEMORY,
                                  # YOUR LAST RESOLVED CALLS, YOUR RECENT
                                  # CALIBRATION and CURRENT REGIME, cutting
                                  # TODAY'S MARKET CONTEXT mid-word. Every judge
                                  # call, for months, with nothing to see it by.
  context_budgets:                # chars per block. NAMED, not derived: three
                                  # of these used to be // 2 and // 4 shares of
                                  # max_context_chars, which is exactly 100% of
                                  # it between them — an oversubscription that
                                  # stayed at 100% however large the total got.
                                  # Unset keys fall back to the old behaviour,
                                  # so removing this block is the rollback path
                                  # and is byte-identical (§61).
    book: 2800                    # max_open_positions: 0 = UNCAPPED (§29), so
                                  # this can list all 38 names — the biggest
                                  # block in the prompt was the unbudgeted one
    trades: 1200                  # 10 rows x ~103 chars, measured
    lessons: 2400                 # wants 2,184 today at top_k_lessons: 8
    market_context: 1000          # uses 364
    scoreboard: 1000              # uses 922
    calibration: 200              # uses 105
    regime: 200                   # uses 49
    research: 900                 # PER-SYMBOL DOSSIER (2026-08-23,
                                  # src/research.py): what news this name has
                                  # carried and how those trades resolved, how
                                  # the judge has called it before and whether
                                  # it was right, earnings proximity, what the
                                  # book holds here and in its sector.
                                  #
                                  # Everything else in this block is GLOBAL —
                                  # the scoreboard is the last 20 calls across
                                  # every symbol, which on a 38-name universe
                                  # is rarely more than one row about the name
                                  # actually being judged.
                                  #
                                  # 4 findings x ~90 chars measured, plus a
                                  # header that names any tool that failed.
                                  # It renders inside the budget by dropping
                                  # WHOLE findings and saying how many, never
                                  # by cutting mid-line.
                                  # + knowledge 1500 (+66 label) and news_memory
                                  # 600, which keep their own keys beside the
                                  # features they belong to. Sum ~10,966 against
                                  # a 12,000 total; preflight warns if that ever
                                  # inverts, and tests/test_context_budget.py
                                  # fails on the shipped config if it does.
  regime:                         # deterministic market-regime tagging from SPY bars
    sma_period: 50                # trend: SPY close vs SMA50
    vol_period: 20                # 20-day realized vol, annualized
    vol_low: 0.15                 # below -> "low"; above vol_high -> "high"
    vol_high: 0.25

ops:
  require_offhost_mirror: true   # OFF-HOST BACKUP MIRROR (2026-08-23). The Bizon
                                 # has ONE 6.9T NVMe, so `backups/` there is on
                                 # the same disk as memory/ — it survives
                                 # `rm -rf memory` and nothing else. Until this
                                 # date the mirror branch of scripts/backup.sh
                                 # only knew how to copy to an iCloud path,
                                 # which exists on a Mac and not on Linux, so
                                 # every weekday run skipped it with a warning
                                 # nobody read.
                                 #
                                 # TRUE makes src/health.py DEGRADE when a
                                 # weekday mirror was due and did not verify.
                                 # health defaults this to FALSE when absent,
                                 # because a laptop and CI have no receipt and
                                 # should not sit permanently degraded — so the
                                 # shipped value is the thing that matters, and
                                 # test_shipped_config.py pins it. Flipping this
                                 # to false is how you would silently give up
                                 # the only copy that survives the disk.
  offhost_mirror_receipt: memory/offhost_mirror.json
                                 # Written by scripts/backup.sh ONLY after the
                                 # remote returned a hash matching the bytes
                                 # uploaded. Its existence IS the verification.
  incident_owner: "Connor Shibley"
                                 # WHO GETS PAGED. Added 2026-08-21: the audit
                                 # found docs/incident_response.md is the
                                 # "solo-operator edition" — a severity table,
                                 # a six-step process, timeline and postmortem
                                 # templates — with no name, no contact and no
                                 # escalation target anywhere in it. N is 1
                                 # here, so this names the operator rather
                                 # than implying a rota that does not exist.
                                 # Preflight warns when this is blank, and
                                 # reports which channel would actually carry
                                 # an alert.
  max_degradations_per_day: 3    # SLO (2026-07-21): >= this many ledgered fail-open
                                 # 'degradation' events in one day -> single slo_breach
                                 # event + macOS alert. Escalates to a human; never HALTs
                                 # (the daily-loss kill switch owns HALT). 0 disables.
  min_close_margin_min: 5        # SLO (2026-08-06): alert once/day if the cycle finishes
                                 # fewer than this many minutes before the 16:00 ET close.
                                 # The cycle fires at 15:45, so the whole budget is 15 min.
                                 # Measured over the first 7 launchd cycles: min 1.63 min,
                                 # median ~2.6, max 7.72 (2026-08-05, which spent a 54s
                                 # stall plus two ~90-100s broker socket hangs). None would
                                 # have fired at 5; a repeat of 08-05's hangs plus any
                                 # growth would.
                                 #
                                 # MARGIN, NOT DURATION, and the distinction is the point:
                                 # a cycle that STARTS late (2026-07-30, three backlogged
                                 # launchd jobs firing at once after the laptop woke) can
                                 # be fast and still miss the bell. A late order is not
                                 # rejected, it is QUEUED FOR THE NEXT OPEN - divergence
                                 # #18 - which silently turns a same-close fill into a
                                 # next-open one that no gate ever modelled.
                                 #
                                 # Escalates to a human; never HALTs. 0 disables.
                                 # Deliberately NOT a 'degradation' event: those are
                                 # counted against max_degradations_per_day above, and a
                                 # timing signal must not spend the fail-open budget.

  # ---- broker resilience (2026-08-06) ----
  # MEASURED FIRST, and it changed the fix. alpaca-py 0.43.5 already retries
  # 429/504 three times by default (RESTClient sets _retry=3, _retry_wait=3),
  # and neither client class lets you turn that off. What it has NEVER had is a
  # timeout: RESTClient._request builds its request options with no `timeout`
  # key at all, and requests' default is None — wait forever.
  #
  # On 2026-08-05 that cost 52.5s (account+positions), 89.7s (one symbol's
  # bars) and 103.7s (an open-order lookup) in a single cycle: 246 seconds,
  # four minutes of a fifteen-minute window, on three dead sockets. All three
  # ended in RemoteDisconnected, which is connection-level and therefore not
  # something the SDK's 429/504 retry ever looked at.
  broker_timeout_sec: 10         # READ timeout (connect is 5). Healthy calls measured
                                 # 0.22-1.3s per symbol across 2026-07-29..08-04, so
                                 # this is ~8x the worst healthy call and ~9x faster
                                 # than the observed hang. 0 disables the timeout
                                 # entirely and restores the hang — it exists so the
                                 # knob has an off position, not as a suggestion.
  broker_retry_attempts: 2       # EXTRA attempts on connection-class failures, READS
                                 # ONLY. Order submission is never auto-retried: on a
                                 # retry Alpaca rejects the duplicate client_order_id
                                 # and the caller would have to tell "already placed"
                                 # from "really failed" — a classifier whose bug
                                 # doubles a position.
  broker_retry_budget_sec: 60    # TOTAL seconds of retrying per cycle, across every
                                 # call. Without this, ~40 symbols x 2 retries x a 10s
                                 # timeout is twenty minutes against a fifteen-minute
                                 # window — a resilience fix that causes divergence
                                 # #18. Once spent, calls still get their timeout but
                                 # stop retrying. 0 disables retrying outright.

reporting:
  starting_equity: 100000        # Alpaca paper account starting capital; the
                                 # dashboard's total-P/L = equity - this
  heat_gap_atr_fraction: 0.5     # review.py heat report: modeled stop gap-through
                                 # (stops do not fill AT the stop) as a fraction of ATR

storage:                 # EVENT STORE BACKEND (2026-07-22, backlog #4)
  backend: jsonl         # jsonl (default, unchanged) | sqlite (container/server
                         # deploys: atomic appends, one file to back up). The
                         # audit trail stays APPEND-ONLY either way.
  sqlite_path: memory/agent.db

memory:
  ledger_path: memory/ledger.jsonl
  learnings_path: memory/learnings.md
  # Runtime STATE, resolved by src/statepaths.py. Both values below are the
  # literals the code has always used, and they are load-bearing: fly symlinks
  # memory/ onto /app/state, docker-compose mounts ./memory:ro for the
  # publisher, and HEARTBEAT.md / docs/runbooks.md / deploy/ name them to
  # operators. src/preflight.py REFUSES to start a cycle if either is changed,
  # so these are redirectable for QA only.
  heartbeat_path: memory/heartbeat
  # Read by the MONITORS (health, watchdog). The trading rail keeps its own
  # copy in risk.py on purpose — a config key that can move the kill switch is
  # a way to disable it (scripts/halt.py:80).
  halt_path: HALT
  negative_example_quota: 0.20   # ≥20% of retrieved past trades must be losers (anti-resonance)
  review_lookback_trades: 25     # how many recent CLOSED trades feed the weekly review
